name: Forge deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      SITE: apih47403.atlassian.net
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap source (first run only)
        run: |
          if [ ! -f manifest.yml ]; then
            curl -sL -o src.tgz "https://drive.google.com/uc?export=download&id=1Rq2k_6ZJtS3Lty_l2np69DFbuymNC5iR"
            tar xzf src.tgz && rm src.tgz
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && git commit -m "Add Claim Buddy source" && git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"

      - name: Install
        run: |
          npm ci || npm install
          npm install -g @forge/cli@latest
          forge settings set usage-analytics false || true
          npm test

      - name: Register app (first run only)
        run: |
          if grep -q "app/00000000-0000-0000-0000-000000000000" manifest.yml; then
            sudo apt-get update -qq && sudo apt-get install -y expect >/dev/null
            expect -c 'set timeout 180
              spawn forge register "Claim Buddy" --accept-terms
              expect {
                -re "Name your Developer Space" { send "Apih Dev Space\r"; exp_continue }
                -re "(?i)select|choose" { send "\r"; exp_continue }
                eof
              }
              catch wait result
              exit [lindex $result 3]'
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --rebase || true
            git add manifest.yml && git commit -m "Register Forge app id [skip ci]" && git push
          fi

      - name: Deploy
        run: forge deploy -e development --non-interactive
        
      - name: Deploy to production
        run: forge deploy -e production --non-interactive

      - name: Install on Jira
        run: |
          forge install -s "$SITE" -p jira -e development --non-interactive --confirm-scopes \
            || forge install -s "$SITE" -p jira -e development --upgrade --non-interactive --confirm-scopes

      - name: Install on Confluence
        continue-on-error: true
        run: |
          forge install -s "$SITE" -p confluence -e development --non-interactive --confirm-scopes \
            || forge install -s "$SITE" -p confluence -e development --upgrade --non-interactive --confirm-scopes
